name: distributed-library

services:
  coordinator-db:
    image: postgis/postgis:17-3.5
    container_name: library-coordinator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LIBRARY_DB_USER:-library_admin}
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD:-library_password}
      POSTGRES_DB: coordinator_db
      TZ: Asia/Shanghai
    ports:
      - "${LIBRARY_DB_BIND_HOST:-127.0.0.1}:${COORDINATOR_DB_PORT:-5436}:5432"
    volumes:
      - coordinator_data:/var/lib/postgresql/data
      - ./database/common/001_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
      - ./database/coordinator/010_schema.sql:/docker-entrypoint-initdb.d/010_schema.sql:ro
      - ./database/coordinator/020_seed.sql:/docker-entrypoint-initdb.d/020_seed.sql:ro
      - ./database/coordinator/data:/docker-entrypoint-initdb.d/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network

  site1-db:
    image: postgis/postgis:17-3.5
    container_name: library-site1-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LIBRARY_DB_USER:-library_admin}
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD:-library_password}
      POSTGRES_DB: site1_db
      TZ: Asia/Shanghai
    ports:
      - "${LIBRARY_DB_BIND_HOST:-127.0.0.1}:${SITE1_DB_PORT:-5433}:5432"
    volumes:
      - site1_data:/var/lib/postgresql/data
      - ./database/common/001_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
      - ./database/site1/010_schema.sql:/docker-entrypoint-initdb.d/010_schema.sql:ro
      - ./database/site1/020_seed.sql:/docker-entrypoint-initdb.d/020_seed.sql:ro
      - ./database/site1/data:/docker-entrypoint-initdb.d/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network

  site2-db:
    image: postgis/postgis:17-3.5
    container_name: library-site2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LIBRARY_DB_USER:-library_admin}
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD:-library_password}
      POSTGRES_DB: site2_db
      TZ: Asia/Shanghai
    ports:
      - "${LIBRARY_DB_BIND_HOST:-127.0.0.1}:${SITE2_DB_PORT:-5434}:5432"
    volumes:
      - site2_data:/var/lib/postgresql/data
      - ./database/common/001_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
      - ./database/site2/010_schema.sql:/docker-entrypoint-initdb.d/010_schema.sql:ro
      - ./database/site2/020_seed.sql:/docker-entrypoint-initdb.d/020_seed.sql:ro
      - ./database/site2/data:/docker-entrypoint-initdb.d/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network

  site3-db:
    image: postgis/postgis:17-3.5
    container_name: library-site3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LIBRARY_DB_USER:-library_admin}
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD:-library_password}
      POSTGRES_DB: site3_db
      TZ: Asia/Shanghai
    ports:
      - "${LIBRARY_DB_BIND_HOST:-127.0.0.1}:${SITE3_DB_PORT:-5435}:5432"
    volumes:
      - site3_data:/var/lib/postgresql/data
      - ./database/common/001_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
      - ./database/site3/010_schema.sql:/docker-entrypoint-initdb.d/010_schema.sql:ro
      - ./database/site3/020_seed.sql:/docker-entrypoint-initdb.d/020_seed.sql:ro
      - ./database/site3/data:/docker-entrypoint-initdb.d/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network

volumes:
  coordinator_data:
  site1_data:
  site2_data:
  site3_data:

networks:
  library-network:
    name: distributed-library-network
    driver: bridge
